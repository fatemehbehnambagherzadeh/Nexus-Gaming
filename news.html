<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="news-style.css" />

    <title>Gaming News</title>
  </head>

  <body>
    <div class="glow"></div>

    <div class="container"></div>

    <header class="page-header">
      <h1>اخبار بازی‌ها</h1>

      <div class="search-box">
        <input type="text" placeholder="جستجو در اخبار بازی‌ها..." />

        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
    </header>
    <section class="featured-news">
      <div class="featured-content">
        <div class="badge">
          <i class="fa-solid fa-star"></i>
          خبر ویژه
        </div>

        <h2>تاریخ انتشار بازی Hellguard II اعلام شد</h2>

        <p>
          استودیوی Nova Games به‌صورت رسمی تاریخ انتشار بازی مورد انتظار
          Hellguard II را اعلام کرد. این عنوان برای PlayStation 5 ،Xbox Series X
          و PC منتشر خواهد شد.
        </p>

        <button>
          مطالعه خبر
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      </div>

      <div class="featured-image">
        <img src="assets/dark.jpg" alt="news" />
      </div>
    </section>
  </body>
</html>
